name: breathe_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_svg: ^2.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/png/
    - assets/svg/
    - assets/fonts/

  fonts:
    - family: SfPro
      fonts:
        - asset: assets/fonts/sf-pro-regular.otf
flutter_intl:
  enabled: true
