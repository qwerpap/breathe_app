name: breathe_app
description: A new Flutter project.
publish_to: none
version: 2.0.0+2
environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.3
  auto_size_text: ^3.0.0
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  google_sign_in: 6.1.5
  vibration: ^3.1.3
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.36
  path_provider: ^2.1.5
  get_it: ^8.0.3
  share_plus: ^11.0.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  intl_utils: ^2.8.5
  drift_dev: ^2.28.1-dev.0
  build_runner: ^2.6.0-dev.1
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/png/icon_app.png
  min_sdk_android: 21
  remove_alpha_ios: true
flutter:
  generate: true
  uses-material-design: true
  assets:
  - assets/png/
  - assets/svg/
  - assets/fonts/
  fonts:
  - family: SfPro
    fonts:
    - asset: assets/fonts/sf-pro-regular.otf
flutter_intl:
  enabled: true
